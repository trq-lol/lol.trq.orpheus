plugins {
    id 'java-base'
    id 'com.diffplug.spotless' version '8.11.0' apply false
    id 'me.champeau.jmh' version '0.7.4' apply false
}

def published = ['core', 'linux', 'windows', 'macos', 'system']

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.diffplug.spotless'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
        options.compilerArgs << '-Xlint:all,-processing,-serial,-options' << '-Werror'
    }

    spotless {
        java {
            palantirJavaFormat('2.91.0').style('PALANTIR')
            removeUnusedImports()
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    if (file('src/jmh').isDirectory()) {
        apply plugin: 'me.champeau.jmh'
        jmh {
            jmhVersion = '1.37'
            fork = 1
            warmupIterations = 3
            warmup = '1s'
            iterations = 5
            timeOnIteration = '1s'
            profilers = ['gc']
            failOnError = true
            resultFormat = 'JSON'
            jvmArgs = ['--enable-native-access=ALL-UNNAMED']
            if (project.hasProperty('jmh.include')) {
                includes = [project.property('jmh.include')]
            }
        }
    }

    if (name in published) {
        apply plugin: 'maven-publish'
        base.archivesName = "orpheus-${project.name}"
        java {
            withSourcesJar()
            withJavadocJar()
        }
        tasks.withType(Javadoc).configureEach {
            options.addBooleanOption('Xdoclint:all,-missing', true)
            options.quiet()
        }
        jar {
            manifest {
                attributes 'Implementation-Title': "orpheus-${project.name}", 'Implementation-Version': project.version
            }
        }
        publishing {
            publications {
                maven(MavenPublication) {
                    artifactId = "orpheus-${project.name}"
                    from components.java
                }
            }
            repositories {
                maven {
                    name = 'GitHubPackages'
                    url = uri('https://maven.pkg.github.com/trq-lol/lol.trq.orpheus')
                    credentials {
                        username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
                        password = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key')
                    }
                }
            }
        }
    }
}

evaluationDependsOnChildren()

// One Javadoc tree for every published module, for the site.
tasks.register('javadocAll', Javadoc) {
    def modules = published.collect { project(":${it}") }
    source modules.collect { it.sourceSets.main.allJava }
    classpath = files(modules.collect { it.sourceSets.main.compileClasspath })
    destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
    javadocTool = javaToolchains.javadocToolFor { languageVersion = JavaLanguageVersion.of(25) }
    exclude 'lol/trq/orpheus/internal/**'
    title = "lol.trq.orpheus ${version}"
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.quiet()
}
