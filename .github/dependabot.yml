version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    ignore:
      # must match the version the windows crate uses
      - dependency-name: windows-future
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
