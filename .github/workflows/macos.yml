# macOS minutes are expensive on private repositories, so this runs only when the macOS parts change or on request.
name: macos
on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'native/macos/**'
      - 'native/publisher-macos/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
    inputs:
      intel:
        description: Also run on an Intel runner
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.intel && '["macos-15","macos-15-intel"]' || '["macos-15"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the helper and the test publisher
        run: |
          sh native/macos/build-adapter.sh
          sh native/publisher-macos/build.sh
      - run: ./gradlew :core:build :macos:build :system:build :harness:installDist
      - name: Live harness against Now Playing
        id: live
        continue-on-error: true
        run: harness/build/install/harness/bin/harness live --out live-macos.jsonl
      - name: Say plainly whether macOS was verified
        run: |
          if [ "${{ steps.live.outcome }}" = "success" ] && grep -q '"failed":0' live-macos.jsonl && ! grep -q '"status":"skip"' live-macos.jsonl; then
            echo "macOS verified on ${{ matrix.runner }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "macOS built but NOT verified on ${{ matrix.runner }}: see the live-macos artifact" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat live-macos.jsonl >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-macos-${{ matrix.runner }}
          path: live-macos.jsonl
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-${{ matrix.runner }}
          path: native/dist/macos-universal
