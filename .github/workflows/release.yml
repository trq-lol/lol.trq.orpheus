# Publishes a version. Manual only: nothing is released by pushing a tag. Run it from the tag to release.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v (must match the tag it is run from)
        required: true
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run from anything but the matching tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          test "$GITHUB_REF" = "refs/tags/v$VERSION"

  windows-native:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - working-directory: native
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --locked -p orpheus-windows --target x86_64-pc-windows-msvc
      - run: |
          New-Item -ItemType Directory -Force dist/windows-x64 | Out-Null
          Copy-Item native/target/x86_64-pc-windows-msvc/release/orpheus.dll dist/windows-x64/
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: natives-windows
          path: dist

  macos-native:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sh native/macos/build-adapter.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: natives-macos
          path: native/dist

  release:
    needs: [windows-native, macos-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true
      - name: Build
        run: ./gradlew spotlessCheck build -Pversion="$VERSION" -Porpheus.natives=$PWD/natives
      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion="$VERSION" -Porpheus.natives=$PWD/natives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$VERSION
          mkdir out
          for module in core linux windows macos system; do
            for kind in "" "-sources"; do
              cp "$module/build/libs/orpheus-$module-${version}${kind}.jar" out/
            done
          done
          (cd out && for jar in *.jar; do sha256sum "$jar" > "$jar.sha256"; done)
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "v$version" --title "lol.trq.orpheus $version" --notes-file notes.md out/*
