[workspace]
resolver = "3"
members = ["orpheus-linux", "orpheus-windows", "publisher-windows"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
windows = "0.62.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
