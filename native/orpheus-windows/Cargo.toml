[package]
name = "orpheus-windows"
description = "Windows media session bridge for lol.trq.orpheus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "orpheus"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
jni-sys = "0.3.1"
windows-future = "0.100.0"
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
